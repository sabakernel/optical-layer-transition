name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - run: deno task fmt --check
      - run: deno task lint
      - run: deno ci
      - run: deno check mod.ts --frozen
      - run: deno test -A --frozen